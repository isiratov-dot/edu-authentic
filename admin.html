<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex"><title>Espace établissement – VérifDiplôme</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef2f3;--surface:#fff;--ink:#14282b;--muted:#566a6d;--line:#cfdadc;--brand:#0e4a4f;--brand-ink:#fff;
  --ok:#1a6b3c;--ok-bg:#e3f3ea;--bad:#a12b2b;--bad-bg:#f8e6e6;--warn:#8a5a00;--warn-bg:#fbefd5;
  --serif:'Spectral',Georgia,'Times New Roman',serif;--sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1b1d;--surface:#16282b;--ink:#e6eeef;--muted:#9bb0b3;--line:#2b4144;--brand:#5cc1c7;--brand-ink:#08262a;--ok:#6fd49a;--ok-bg:#15382a;--bad:#f09a9a;--bad-bg:#3b1c1c;--warn:#f0c470;--warn-bg:#3a2d10}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1b1d;--surface:#16282b;--ink:#e6eeef;--muted:#9bb0b3;--line:#2b4144;--brand:#5cc1c7;--brand-ink:#08262a;--ok:#6fd49a;--ok-bg:#15382a;--bad:#f09a9a;--bad-bg:#3b1c1c;--warn:#f0c470;--warn-bg:#3a2d10}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.6 var(--sans)}
.wrap{max-width:980px;margin:0 auto;padding:0 1.25rem}
header.top{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 0;gap:1rem;flex-wrap:wrap}
.logo{font:700 1.25rem var(--serif);color:var(--brand);display:flex;align-items:center;gap:.55rem}
.logo svg{width:28px;height:28px}
nav a{color:var(--muted);text-decoration:none;margin-left:1.1rem;font-size:.93rem}
nav a:hover{color:var(--ink);text-decoration:underline}
nav a.adm{border:1px solid var(--line);border-radius:999px;padding:.3rem .8rem;color:var(--ink)}
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:2.5rem;align-items:center;padding:2.2rem 0 3rem}
h1{font:700 clamp(2rem,5vw,3.1rem)/1.12 var(--serif);margin:0 0 1rem;letter-spacing:-.01em}
.lead{color:var(--muted);max-width:46ch;margin:0 0 1rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:1.4rem}
.tabs{display:flex;gap:.4rem;margin-bottom:1rem;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:.55rem .8rem;font:600 .95rem var(--sans);color:var(--muted);cursor:pointer;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--brand);border-bottom-color:var(--brand)}
label{display:block;font-weight:600;font-size:.9rem;margin:.8rem 0 .3rem}
input,select{width:100%;padding:.7rem .8rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink);font:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.hint{font-size:.82rem;color:var(--muted);margin:.35rem 0 0}
.btn{margin-top:1.1rem;padding:.75rem 1.1rem;border:0;border-radius:6px;background:var(--brand);color:var(--brand-ink);font:600 1rem var(--sans);cursor:pointer}
.btn.full{width:100%}.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.sm{margin:0;padding:.3rem .65rem;font-size:.82rem}
.btn:hover{filter:brightness(1.08)}
#result{margin-top:1.1rem}
.res{display:grid;grid-template-columns:auto 1fr;gap:1rem;padding:1rem;border-radius:8px;border:1px solid currentColor;animation:pop .35s ease-out}
.res.ok{background:var(--ok-bg);color:var(--ok)}.res.bad{background:var(--bad-bg);color:var(--bad)}.res.warn{background:var(--warn-bg);color:var(--warn)}
.res .body{color:var(--ink)}.res h3{margin:0 0 .3rem;font:700 1.1rem var(--serif);color:inherit}
.seal{width:64px;height:64px;border-radius:50%;border:3px double currentColor;display:grid;place-items:center;transform:rotate(-8deg)}
.seal svg{width:30px;height:30px}
dl{margin:.5rem 0 0;display:grid;grid-template-columns:auto 1fr;gap:.2rem .9rem;font-size:.92rem}
dt{color:var(--muted)}dd{margin:0;font-weight:500}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.res{animation:none}html{scroll-behavior:auto}}
section{padding:2.4rem 0;border-top:1px solid var(--line)}
h2{font:700 1.6rem var(--serif);margin:0 0 1.2rem}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:1.2rem;counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s}
.steps li::before{content:counter(s);display:grid;place-items:center;width:2rem;height:2rem;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-weight:600;margin-bottom:.6rem}
.steps strong{display:block;margin-bottom:.2rem}.steps span,.cols p{color:var(--muted);font-size:.94rem}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:1.5rem}.cols p{margin:.3rem 0 0}
details{border-bottom:1px solid var(--line);padding:.8rem 0}
summary{cursor:pointer;font-weight:600}details p{color:var(--muted);margin:.5rem 0 0}
.demo{display:none;font-size:.9rem;color:var(--muted);margin:1rem 0 0}
.demo button{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:.25rem .7rem;margin:.2rem .3rem .2rem 0;font:500 .85rem var(--sans);cursor:pointer}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 1rem}
.tw{overflow-x:auto;margin-top:1.2rem}
table{border-collapse:collapse;width:100%;font-size:.88rem;min-width:640px}
th,td{text-align:left;padding:.55rem .6rem;border-bottom:1px solid var(--line);vertical-align:middle}
.badge{display:inline-block;padding:.1rem .55rem;border-radius:999px;font-size:.78rem;font-weight:600}
.badge.valide{background:var(--ok-bg);color:var(--ok)}.badge.revoque{background:var(--bad-bg);color:var(--bad)}
.rowact{display:flex;gap:.4rem;flex-wrap:wrap}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);max-width:340px;text-align:center}
dialog canvas,dialog img{max-width:100%}
.note{padding:1rem;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}
footer{padding:1.8rem 0 2.5rem;color:var(--muted);font-size:.88rem;border-top:1px solid var(--line)}
@media (max-width:760px){.hero,.steps,.cols,.grid2{grid-template-columns:1fr}nav a:not(.adm){display:none}.hero{padding-top:1rem}}
</style></head><body><div class="wrap">
<header class="top"><div class="logo">VérifDiplôme · Espace établissement</div><nav><a href="/">← Retour au site</a></nav></header>
<main>
<section id="login" class="panel" style="max-width:420px;margin:2rem auto"><h2>Connexion</h2>
<form id="lf"><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password"><button class="btn full" type="submit">Se connecter</button></form><p class="hint" id="lmsg" aria-live="polite"></p></section>
<section id="app" hidden>
<div class="panel"><strong>Inscrire un document</strong>
<form id="af" class="grid2" novalidate>
<div><label for="a-type">Type</label><select id="a-type"><option value="diplome">Diplôme</option><option value="formation">Attestation de formation</option></select></div>
<div><label for="a-nom">Nom du titulaire</label><input id="a-nom"></div>
<div><label for="a-naiss">Date de naissance</label><input id="a-naiss" type="date"></div>
<div><label for="a-lieu">Lieu de naissance</label><input id="a-lieu"></div>
<div><label for="a-titre">Intitulé</label><input id="a-titre"></div>
<div><label for="a-etab">Établissement</label><input id="a-etab"></div>
<div><label for="a-date">Date de délivrance</label><input id="a-date" type="date"></div>
<div><label for="a-duree">Durée</label><input id="a-duree" placeholder="Ex. 3 ans"></div>
<div><button class="btn" type="submit">Enregistrer le document</button></div></form><p class="hint" id="amsg" aria-live="polite"></p></div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-top:1.4rem;gap:.6rem;flex-wrap:wrap"><strong id="cnt"></strong>
<span class="rowact"><label class="btn ghost sm" style="margin:0;font-weight:500">Importer (JSON)<input id="imp" type="file" accept=".json" hidden></label><button class="btn ghost sm" id="csv">Exporter en CSV</button><button class="btn ghost sm" id="out">Déconnexion</button></span></div>
<div class="tw"><table><thead><tr><th>Numéro</th><th>Titulaire</th><th>Intitulé</th><th>Statut</th><th>Actions</th></tr></thead><tbody id="tb"></tbody></table></div>
</section></main></div>
<dialog id="qrd"><h3 id="qrt" style="font-family:var(--serif);margin-top:0"></h3><div id="qrimg"></div><p class="hint">Imprimez ce code sur le document.</p><button class="btn ghost" onclick="document.getElementById('qrd').close()">Fermer</button></dialog>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let pw="",docs=[];try{pw=sessionStorage.getItem("pw")||""}catch(e){}
async function api(action,data={}){
 const r=await fetch("/.netlify/functions/admin",{method:"POST",headers:{"Content-Type":"application/json","x-admin-password":pw},body:JSON.stringify({action,...data})});
 const j=await r.json().catch(()=>({}));if(!r.ok){const e=new Error(j.error||"Erreur");e.code=r.status;throw e}return j}
async function load(){
 try{docs=(await api("list")).docs;$("login").hidden=true;$("app").hidden=false;draw()}
 catch(e){$("app").hidden=true;$("login").hidden=false;$("lmsg").textContent=pw?(e.code===401?"Mot de passe incorrect.":e.message):""}}
function draw(){
 $("cnt").textContent=`${docs.length} document${docs.length>1?"s":""} enregistré${docs.length>1?"s":""}`;
 $("tb").innerHTML=docs.map(r=>`<tr><td>${esc(r.num)}</td><td>${esc(r.nom)}<br><small style="color:var(--muted)">né(e) le ${esc(r.naiss)} à ${esc(r.lieu)}</small></td><td>${esc(r.titre)}</td><td><span class="badge ${r.statut}">${r.statut==="valide"?"Valide":"Révoqué"}</span></td><td><div class="rowact"><button class="btn ghost sm" data-a="qr" data-n="${esc(r.num)}">QR code</button><button class="btn ghost sm" data-a="tog" data-n="${esc(r.num)}">${r.statut==="valide"?"Révoquer":"Rétablir"}</button><button class="btn ghost sm" data-a="del" data-n="${esc(r.num)}">Supprimer</button></div></td></tr>`).join("")||'<tr><td colspan="5">Aucun document.</td></tr>'}
$("lf").addEventListener("submit",e=>{e.preventDefault();pw=$("pw").value;try{sessionStorage.setItem("pw",pw)}catch(x){}load()});
$("out").addEventListener("click",()=>{pw="";try{sessionStorage.removeItem("pw")}catch(x){}$("pw").value="";$("lmsg").textContent="";load()});
document.addEventListener("click",async e=>{
 const b=e.target.closest("button[data-a]");if(!b)return;const n=b.dataset.n;
 try{
  if(b.dataset.a==="qr"){const q=qrcode(0,"M");q.addData(location.origin+"/\nN° "+n);q.make();$("qrt").textContent=n;$("qrimg").innerHTML=q.createImgTag(5,8);$("qrd").showModal();return}
  if(b.dataset.a==="del"&&!confirm("Supprimer définitivement "+n+" ?"))return;
  await api(b.dataset.a==="tog"?"toggle":"delete",{num:n});await load()
 }catch(err){$("amsg").textContent=err.message}});
$("af").addEventListener("submit",async e=>{
 e.preventDefault();const v=id=>$(id).value.trim(),m=$("amsg");
 const doc={type:v("a-type"),nom:v("a-nom"),naiss:v("a-naiss"),lieu:v("a-lieu"),titre:v("a-titre"),etab:v("a-etab"),date:v("a-date"),duree:v("a-duree")};
 if(!doc.nom||!doc.naiss||!doc.lieu||!doc.titre||!doc.etab||!doc.date){m.textContent="Renseignez tous les champs (sauf la durée).";return}
 try{const r=await api("add",{doc});m.textContent="Document enregistré : "+r.num;["a-nom","a-naiss","a-lieu","a-titre","a-duree"].forEach(i=>$(i).value="");await load()}catch(err){m.textContent=err.message}});
$("imp").addEventListener("change",async e=>{
 try{const d=JSON.parse(await e.target.files[0].text());const r=await api("import",{docs:d});$("amsg").textContent=r.count+" document(s) importé(s).";await load()}catch(err){$("amsg").textContent="Import impossible : "+err.message}e.target.value=""});
$("csv").addEventListener("click",()=>{
 const h=["num","type","nom","naiss","lieu","titre","etab","date","duree","statut"],q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
 const t=[h.join(",")].concat(docs.map(r=>h.map(k=>q(r[k])).join(","))).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["\ufeff"+t],{type:"text/csv"}));a.download="registre.csv";a.click()});
load();
</script></body></html>
